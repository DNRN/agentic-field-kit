[package]
name = "agentic-field-kit"
# The toolkit release: equal to .claude-plugin/plugin.json (tests/release.test.sh).
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "Agentic Field Kit (afk): install agent components into a project or globally"
license = "MIT"
repository = "https://github.com/DNRN/agentic-field-kit"
publish = false
build = "build.rs"

[[bin]]
name = "afk"
path = "src/main.rs"

# publish = false keeps it off crates.io; dist still releases the binary (ADR 0010).
[package.metadata.dist]
dist = true

[dependencies]
# Self-update through dist's install receipt (ADR 0022). reqwest and tokio
# are axoupdater's own: named here for the client timeout and the runtime.
axoupdater = "0.10"
clap = { version = "4", features = ["derive"] }
dunce = "1"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = "3"
