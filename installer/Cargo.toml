[package]
name = "agentic-toolkit"
# The toolkit release: equal to .claude-plugin/plugin.json (tests/release.test.sh).
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Install agentic-toolkit components into a project or globally"
license = "MIT"
repository = "https://github.com/DNRN/agentic-toolkit"
publish = false
build = "build.rs"

[[bin]]
name = "agentic-toolkit"
path = "src/main.rs"

# publish = false keeps it off crates.io; dist still releases the binary (ADR 0010).
[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4", features = ["derive"] }
dunce = "1"
ratatui = "0.30"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
