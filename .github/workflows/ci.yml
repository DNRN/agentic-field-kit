name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shellcheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck hooks/scripts/*.sh tests/*.sh evals/*/*/scaffold.sh
      # tests/install.test.sh runs in the rust job, against the built binary.
      - name: Regression tests
        run: |
          for t in tests/*.test.sh; do
            [ "$t" = tests/install.test.sh ] || bash "$t" || status=1
          done
          exit "${status:-0}"

  rust:
    name: Rust installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format, lint, unit tests, release build
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
      # The tests create symlinks as fixtures; without
      # MSYS=winsymlinks:nativestrict, Git Bash's ln -s copies.
      - name: Catalog and installer tests against the binary
        env:
          MSYS: winsymlinks:nativestrict
        run: |
          bin="$PWD/target/release/agentic-toolkit"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" --check --source .
          bash tests/catalog.test.sh
          AGENTIC_TOOLKIT_BIN="$bin" bash tests/install.test.sh

  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # Not --strict here either: the validator scans agents/ and commands/ and
      # warns that their README.md has no frontmatter, although plugin.json's
      # explicit lists keep those files from loading (CLI 2.1.312 scans them in
      # the marketplace check too; 2.1.288 didn't). tests/plugin-manifest.test.sh
      # guards the lists. Every other warning or error fails the job.
      - name: Validate marketplace
        run: |
          claude plugin validate --json . > validate.json || { cat validate.json; exit 1; }
          jq -e '[.manifest.errors[], .manifest.warnings[], (.contents[] | .errors[]),
                  (.contents[] | select(.file | endswith("/README.md") | not) | .warnings[])]
                 | length == 0' validate.json > /dev/null || { cat validate.json; exit 1; }
      - name: Validate plugin manifest and components
        run: claude plugin validate .claude-plugin/plugin.json

  docs:
    name: Links and diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every mermaid diagram
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          mapfile -t files < <(git grep -l '^```mermaid' -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then echo "no mermaid diagrams"; exit 0; fi
          status=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            out="$RUNNER_TEMP/mermaid/$(dirname "$f")"
            mkdir -p "$out"
            npx -y @mermaid-js/mermaid-cli@11 -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "$out/$(basename "$f")" || { echo "::error file=$f::mermaid diagram failed to render"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
