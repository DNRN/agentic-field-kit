[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms (ADR 0010): Linux on musl, so no glibc dependency.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build every artifact on pull requests too, without publishing, so a broken
# target shows before a release tag.
pr-run-mode = "upload"
# Plugin releases are tagged agentic-toolkit--vX.Y.Z by `claude plugin tag`,
# which dist can't parse; installer releases get their own tag, which also
# keeps the plugin tag from starting this workflow.
tag-namespace = "installer"
# The binary embeds the Entropy Fox logo, which isn't MIT (ADR 0011); ship
# its licence (and the logo files) in every archive.
include = ["assets/brand/"]
